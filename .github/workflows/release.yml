# 출시 — 공개 거울 developedby-dev/sdk-typescript (ADR-0050). 원천은 모노레포 sdks/typescript/.github/workflows/release.yml — 거울에서 고치지 않는다.
# 판 태그(v1.0.0)를 밀면 짓고 시험한 꾸러미를, 환경 release에서 대표가 승인한 뒤 npm 신뢰 게시(OIDC — 출처 증명은 자동)로 올린다.
# 손으로 돌리면(workflow_dispatch) 짓기 · 시험만 한다. 순서는 모노레포 docs/runbooks/sdk-release.md
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install
      - run: pnpm run typecheck
      - run: pnpm test
      # pnpm pack — publishConfig의 exports(dist)를 꾸러미에 적용한다. npm pack은 적용하지 않아 0.1.0이 src/*.ts를 가리킨 채 나갔다(2026-11-21)
      - run: pnpm pack
      - name: 꾸러미 확인 — exports가 dist를 가리키고, 빈 프로젝트에 설치해 네 진입점을 불러온다
        run: |
          set -euo pipefail
          tgz=$(ls bydev-sdk-*.tgz)
          tar xzf "$tgz" -O package/package.json | node -e '
            const p = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const [k, v] of Object.entries(p.exports)) {
              const t = typeof v === "string" ? v : v.default;
              if (!t.startsWith("./dist/")) { console.error("exports가 dist 밖을 가리킨다:", k, t); process.exit(1); }
            }'
          dir=$(mktemp -d)
          cp "$tgz" "$dir/"
          cd "$dir"
          npm init -y >/dev/null
          npm install "./$tgz" >/dev/null
          node --input-type=module -e 'for (const m of ["@bydev/sdk", "@bydev/sdk/server", "@bydev/sdk/node", "@bydev/sdk/extension"]) await import(m); console.log("네 진입점 import 통과")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # 신뢰 게시는 npm CLI 11.5.1 이상
      - run: npm install --global npm@11
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: 태그와 꾸러미 판이 같은지
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "bydev-sdk-${TAG#v}.tgz"
      - name: 게시 (신뢰 게시 · 출처 증명)
        env:
          TAG: ${{ github.ref_name }}
        run: npm publish "./bydev-sdk-${TAG#v}.tgz" --access public
